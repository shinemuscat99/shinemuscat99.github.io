<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강릉청년 놀줴이야</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1861791450976149"
     crossorigin="anonymous"></script>
  <!-- 글꼴: Pretendard (인터넷이 없으면 시스템 기본 글꼴로 바뀌고, 페이지는 그대로 동작합니다.) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <main class="app">

    <!-- 데이터 파일 입력 오류·안내 (모든 화면 위쪽에 보임) -->
    <div id="data-alerts" class="alerts" hidden>
      <div id="data-error" class="notice notice-error" role="alert" hidden></div>
      <details id="data-warning" class="notice notice-warning" hidden>
        <summary id="warning-summary"></summary>
        <div id="warning-body" class="warning-body"></div>
      </details>
    </div>

    <!-- 시작 화면 -->
    <section id="screen-start" class="screen is-active" aria-labelledby="start-title">

      <!-- 첫 화면: 강릉 바다 사진 위에 제목 -->
      <div class="hero">
        <img class="hero-photo" src="images/hero-beach.jpg" alt="" data-parallax="0.35">
        <div class="hero-shade" aria-hidden="true"></div>

        <div class="frame-top">
          <span class="v-mark" aria-hidden="true">강<br>릉</span>
          <span class="frame-mark" aria-hidden="true"></span>
        </div>

        <div class="hero-copy">
          <p class="hero-kicker" data-anim>오늘, 강릉에서 뭐 하지?</p>
          <h1 id="start-title" data-anim>강릉청년 놀줴이야</h1>
          <p class="lead" data-anim>지금 상황과 끌리는 것, 동네를 고르면<br>지금 가기 좋은 강릉 가게를 골라 드려요.</p>
          <button id="btn-start" class="btn btn-pill btn-ghost-light magnetic" type="button" data-anim>시작하기</button>
        </div>

      </div>
    </section>

    <!-- 단계 화면 (상황 → 끌리는 것 → 동네) -->
    <section id="screen-question" class="screen" aria-live="polite">
      <!-- 위쪽 막대: 세로 로고 + 진행 막대 + 단계 숫자 -->
      <header class="topbar">
        <span class="v-mark v-mark-small" aria-hidden="true">강<br>릉</span>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-text" class="step-badge">1 / 3</span>
      </header>
      <!-- 단계 버튼 [상황] [종류] [위치]: 이미 고른 단계를 누르면 그 단계로 돌아감 (app.js가 채움) -->
      <nav class="step-nav" aria-label="단계 다시 고르기"></nav>
      <!-- 특정 '동네 + 상황'일 때만 보이는 추천 카드 (flow.js의 STEP_TIPS) -->
      <div id="step-tip" class="step-tip" hidden></div>
      <div class="question-head">
        <h2 id="question-title" class="question-title"></h2>
        <p id="question-hint" class="question-hint">딱 하나만 골라 주세요.</p>
      </div>
      <div id="options" class="options"></div>
      <!-- 여러 개 고르는 단계(상황)에서만 보이는 [다음] 버튼 -->
      <button id="btn-next" class="btn btn-pill btn-green btn-next" type="button" hidden>다음</button>
      <div class="question-actions">
        <button id="btn-back" class="btn btn-pill btn-line" type="button">이전으로</button>
        <button id="btn-restart" class="btn btn-pill btn-line" type="button">처음으로</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen">
      <div class="result-aside">
        <!-- 결과 머리: 하늘색 띠 위에 제목 → 내가 고른 길 -->
        <div class="result-head">
          <div class="frame-top">
            <span class="v-mark" aria-hidden="true">강<br>릉</span>
            <span class="frame-mark" aria-hidden="true"></span>
          </div>
          <h2 id="result-title" class="result-title" data-anim></h2>
          <p id="route-path" class="route-path" data-anim></p>
        </div>
        <!-- 단계 버튼: 결과에서 바로 상황·종류·위치를 다시 고르기 -->
        <nav class="step-nav" aria-label="단계 다시 고르기"></nav>
        <div class="result-actions">
          <button id="btn-result-back" class="btn btn-pill btn-line" type="button">이전으로</button>
          <button id="btn-result-restart" class="btn btn-pill btn-dark magnetic" type="button">처음부터 다시</button>
        </div>
      </div>

      <div class="result-main">
        <p id="result-message" class="result-message" hidden></p>

        <h3 id="same-title" class="section-title"></h3>
        <ol id="same-list" class="place-list"></ol>

        <details id="other-areas" class="other-areas" hidden>
          <summary id="other-summary">다른 동네도 볼래?</summary>
          <div id="other-groups" class="other-groups"></div>
        </details>

        <div id="suggestions" class="suggestions" hidden>
          <p id="suggestion-title" class="suggestion-title"></p>
          <div id="suggestion-list" class="suggestion-list"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- flow.js, places.js에 문법 오류가 있을 때 몇 번째 줄인지 알아내기 위한 코드 -->
  <script>
    window.DATA_FILE_ERRORS = {};
    window.addEventListener("error", function (e) {
      ["flow.js", "places.js"].forEach(function (file) {
        if (e.filename && e.filename.indexOf(file) !== -1) {
          window.DATA_FILE_ERRORS[file] = { line: e.lineno, message: e.message };
        }
      });
    });
  </script>
  <script src="flow.js?v=7"></script>
  <script src="places.js?v=7"></script>
  <script src="app.js?v=7"></script>
  <script src="motion.js?v=7"></script>
</body>
</html>
